<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>절세 점검</title>
  <meta name="description" content="연말정산 절세 월간 점검 — 올해 공제 한도까지 얼마 남았는지 매달 확인하세요." />
  <meta name="theme-color" content="#1f6feb" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#11161d" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="절세점검" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="icons/icon.svg" alt="" width="28" height="28" />
      <span>절세 점검</span>
    </div>
    <div class="topbar-right">
      <select id="year-select" aria-label="귀속연도"></select>
      <button id="sync-badge" class="sync-badge" type="button" title="동기화 상태">이 기기</button>
    </div>
  </header>

  <div id="update-banner" class="update-banner" hidden>
    <div>
      <strong id="update-title">새 버전이 있어요</strong>
      <span id="update-notes"></span>
    </div>
    <button id="update-apply" class="btn btn-primary btn-sm" type="button">지금 업데이트</button>
  </div>

  <main id="view" tabindex="-1"></main>

  <nav class="tabbar" aria-label="메뉴">
    <a href="#home" data-tab="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg><span>홈</span></a>
    <a href="#input" data-tab="input"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16zM14 6l4 4"/></svg><span>월별 입력</span></a>
    <a href="#status" data-tab="status"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V10M12 20V4M19 20v-7"/></svg><span>공제 현황</span></a>
    <a href="#review" data-tab="review"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 11l2 2 4-4M5 4h14v16H5z"/></svg><span>작년 점검</span></a>
    <a href="#settings" data-tab="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg><span>설정</span></a>
  </nav>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <dialog id="dialog"></dialog>

  <noscript>이 앱은 자바스크립트가 필요합니다.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
